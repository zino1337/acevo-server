name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    outputs:
      docker_image_changed: ${{ steps.docker-image-changes.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Docker image changes
        id: docker-image-changes
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] ||
             ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            changed=true
          else
            while IFS= read -r path; do
              case "${path}" in
                Dockerfile|.dockerignore|VERSION|config/*|dashboard/*|scripts/*)
                  changed=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${PREVIOUS_SHA}" "${GITHUB_SHA}")
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Docker image changed: ${changed}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release version
        run: |
          release_version="$(tr -d '[:space:]' < VERSION)"
          [[ "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain a semantic version such as 1.0.0."
            exit 1
          }

      - name: Require a new version for main
        if: >-
          steps.docker-image-changes.outputs.changed == 'true' &&
          ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'main'))
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          release_version="$(tr -d '[:space:]' < VERSION)"
          previous_version="$(git show "${PREVIOUS_SHA}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"

          if [[ -z "${previous_version}" ]]; then
            echo "First versioned release: ${release_version}"
            exit 0
          fi
          if [[ "${release_version}" == "${previous_version}" ]]; then
            echo "VERSION must be increased before merging to main (current: ${release_version})."
            exit 1
          fi
          newest_version="$(printf '%s\n%s\n' "${previous_version}" "${release_version}" | sort -V | tail -n 1)"
          if [[ "${newest_version}" != "${release_version}" ]]; then
            echo "VERSION must increase from ${previous_version}, got ${release_version}."
            exit 1
          fi

      - name: Run checks
        run: npm run check

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check.outputs.docker_image_changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker image tags
        id: docker-image-tags
        run: |
          test -n "${DOCKER_IMAGE_NAME}" || {
            echo "DOCKER_IMAGE_NAME GitHub variable is required."
            exit 1
          }

          case "${GITHUB_REF_NAME}" in
            main)
              release_version="$(tr -d '[:space:]' < VERSION)"
              tags="${DOCKER_IMAGE_NAME}:latest
          ${DOCKER_IMAGE_NAME}:${release_version}"
              ;;
            staging)
              tags="${DOCKER_IMAGE_NAME}:staging"
              ;;
            *)
              echo "Docker image publishing is only configured for main or staging (got ${GITHUB_REF_NAME})."
              exit 1
              ;;
          esac

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved Docker image tags:"
          echo "${tags}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-image-tags.outputs.tags }}

      - name: Update Docker Hub description
        if: github.ref_name == 'main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE_NAME }}
          readme-filepath: ./README.dockerhub.md
          short-description: Assetto Corsa EVO dedicated server Docker image
