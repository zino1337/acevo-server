<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AC EVO Server Dashboard</title>
    <link rel="stylesheet" href="/static/theme.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&family=Material+Symbols+Outlined&display=swap"
    />
    <style>
      .material-symbols-outlined,
      md-icon {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
      }
    </style>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>AC EVO Server Dashboard</h1>
      <span id="status-chip" class="status-chip unknown">
        <span class="status-dot"></span><span id="status-text">…</span>
      </span>
      <span class="spacer"></span>
      <div class="controls">
        <md-filled-tonal-button id="btn-start">Start</md-filled-tonal-button>
        <md-outlined-button id="btn-stop">Stop</md-outlined-button>
        <md-outlined-button id="btn-restart">Restart</md-outlined-button>
        <md-outlined-button id="btn-logs">Logs</md-outlined-button>
        <md-outlined-button id="btn-save">Save</md-outlined-button>
        <md-filled-button id="btn-save-apply">Save &amp; Apply</md-filled-button>
        <label class="theme-toggle">
          <md-icon>dark_mode</md-icon>
          <md-switch id="theme-switch" aria-label="Dark mode"></md-switch>
        </label>
      </div>
    </header>

    <main class="layout">
      <section id="col-server">
        <div class="card">
          <h2>Server Info</h2>
          <div id="server-fields" class="field-grid"></div>
        </div>
        <div class="card">
          <h2>Advanced</h2>
          <div id="advanced-fields" class="field-grid"></div>
          <div class="cars-meta">Config file: <span id="config-path">—</span></div>
        </div>
      </section>

      <section id="col-event">
        <div class="card">
          <h2>Event Settings</h2>
          <div id="event-fields" class="field-grid"></div>
        </div>
        <div class="card">
          <h2>Cars</h2>
          <div id="cars-container"></div>
        </div>
      </section>

      <section id="col-sessions">
        <div id="sessions-container"></div>
        <div class="card">
          <h2>Preview &amp; Validation</h2>
          <div id="preview" class="preview"></div>
        </div>
      </section>
    </main>

    <section id="logs-panel" class="logs-panel card hidden">
      <h2>Server Logs</h2>
      <div id="logs-output" class="logs-output">(logs appear here when the server is running)</div>
    </section>

    <md-dialog id="confirm-dialog">
      <div slot="headline" id="confirm-headline">Confirm</div>
      <div slot="content" id="confirm-message"></div>
      <div slot="actions">
        <md-text-button id="confirm-cancel">Cancel</md-text-button>
        <md-filled-button id="confirm-ok">Confirm</md-filled-button>
      </div>
    </md-dialog>

    <div id="toast" class="toast"></div>
  </body>
</html>
